name: Refresh README badges

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Release and publish to npm"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate badge SVGs
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate badges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-badges.mjs

      - name: Commit refreshed badges
        run: |
          if git diff --quiet -- assets/badges; then
            echo "Badges are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badges
          git commit -m "chore(badges): refresh README badges"
          git push
