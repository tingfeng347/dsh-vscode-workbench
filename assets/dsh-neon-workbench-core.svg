<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title desc">
  <title id="title">DSH VS Code Workbench logo</title>
  <desc id="desc">A neon workbench mark with an activity bar and code brackets for DSH.</desc>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13284d"/>
      <stop offset="1" stop-color="#0a1026"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.24" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="0.76" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#edge)" stroke-linecap="round" filter="url(#glow)">
    <path d="M112 204C112 152 154 112 206 112H306C358 112 400 152 400 204"
          stroke-width="16" opacity="0.72"/>
    <path d="M112 308C112 360 154 400 206 400H306C358 400 400 360 400 308"
          stroke-width="16" opacity="0.72"/>
    <path d="M96 256H152M360 256H416" stroke-width="16" opacity="0.48"/>
  </g>

  <rect x="160" y="160" width="192" height="192" rx="28" fill="#020617" opacity="0.7"/>
  <rect x="176" y="176" width="160" height="160" rx="20" fill="url(#core)"
        stroke="url(#neon)" stroke-width="4"/>

  <g filter="url(#glow)">
    <rect x="192" y="190" width="22" height="132" rx="8" fill="none"
          stroke="url(#neon)" stroke-width="5"/>
    <circle cx="203" cy="212" r="4.5" fill="url(#neon)"/>
    <circle cx="203" cy="256" r="4.5" fill="url(#neon)"/>
    <circle cx="203" cy="300" r="4.5" fill="url(#neon)"/>
  </g>

  <g fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#glow)">
    <path d="M260 218L234 256L260 294" stroke-width="13"/>
    <path d="M292 218L318 256L292 294" stroke-width="13"/>
    <rect x="270" y="226" width="12" height="60" rx="6" fill="url(#neon)" stroke="none"/>
  </g>
</svg>
