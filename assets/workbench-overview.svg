<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">DSH VS Code Workbench layout</title>
  <desc id="desc">An animated cutaway of the workbench overlay: activity bar, Explorer/Search/Source Control sidebar, Monaco editor, DSH conversation panel and status bar.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#151517"/>
      <stop offset="100%" stop-color="#1c1d20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#679efe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <rect width="720" height="420" rx="16" fill="url(#bg)"/>

  <!-- window chrome -->
  <rect width="720" height="46" x="0" y="0" fill="#111113" rx="16"/>
  <rect width="720" height="16" x="0" y="30" fill="#111113"/>
  <circle cx="22" cy="23" r="5" fill="#f87171"/>
  <circle cx="38" cy="23" r="5" fill="#fbbf24"/>
  <circle cx="54" cy="23" r="5" fill="#34d399"/>
  <text x="700" y="28" fill="#7d8590" font-size="13" text-anchor="end">dsh web — session · VS Code Workbench</text>
  <rect width="720" height="2" x="0" y="46" fill="url(#accent)" opacity=".8"/>

  <!-- ======================= activity bar ======================= -->
  <rect width="48" height="332" x="0" y="48" fill="#151517"/>
  <line x1="48" y1="48" x2="48" y2="380" stroke="#ffffff14"/>

  <g>
    <animate attributeName="opacity" dur="9s" keyTimes="0;0.28;0.33;0.94;1" repeatCount="indefinite" values="1;1;0;0;0"/>
    <rect width="2" height="48" x="0" y="50" fill="#679efe"/>
  </g>
  <g fill="none" stroke="#cfd3d6" stroke-width="1.6" stroke-linejoin="round">
    <path d="M18 58 h10 l2 3 v13 h-12 z"/>
    <path d="M21 56 h10 l2 3 v13 h-12 z" fill="#151517" stroke="#cfd3d6"/>
  </g>

  <g>
    <animate attributeName="opacity" dur="9s" keyTimes="0;0.33;0.36;0.61;0.66;1" repeatCount="indefinite" values="0;0;1;1;0;0"/>
    <rect width="2" height="48" x="0" y="98" fill="#679efe"/>
    <g fill="none" stroke="#cfd3d6" stroke-width="1.8">
      <circle cx="23" cy="118" r="7"/>
      <line x1="28.4" y1="123.4" x2="33" y2="128"/>
    </g>
  </g>

  <g>
    <animate attributeName="opacity" dur="9s" keyTimes="0;0.66;0.69;0.94;1" repeatCount="indefinite" values="0;0;1;1;0"/>
    <rect width="2" height="48" x="0" y="146" fill="#679efe"/>
    <g fill="none" stroke="#cfd3d6" stroke-width="1.6">
      <circle cx="19" cy="162" r="3.4"/>
      <circle cx="29" cy="170" r="3.4"/>
      <path d="M19 162 q2 2 4 4"/>
      <path d="M29 170 q0 -2 -2 -3"/>
    </g>
  </g>

  <!-- dsh mark pinned at the bottom -->
  <g fill="#679efe">
    <circle cx="24" cy="344" r="7"/>
    <path d="M24 337 q-1 -4 -3 -6 q2 -1 3 0 q1 -1 3 0 q-2 2 -3 6 z"/>
    <circle cx="27" cy="343" r="1.4" fill="#151517"/>
  </g>

  <!-- ======================= sidebar ======================= -->
  <rect width="210" height="332" x="48" y="48" fill="#232324"/>
  <line x1="258" y1="48" x2="258" y2="380" stroke="#ffffff14"/>

  <!-- Explorer -->
  <g>
    <animate attributeName="opacity" dur="9s" keyTimes="0;0.28;0.33;0.94;1" repeatCount="indefinite" values="1;1;0;0;0"/>
    <text x="60" y="70" fill="#adb2b8" font-size="11" letter-spacing=".6">EXPLORER</text>
    <path d="M60 92 l4 4 l-4 4 z" fill="#adb2b8"/>
    <path d="M72 90 h8 v2 h6 l2 2 v8 h-16 z" fill="#679efe"/>
    <text x="94" y="97" fill="#cfd3d6" font-size="12">src</text>
    <path d="M84 114 h6 v2 h8 v9 h-14 z" fill="none" stroke="#cfd3d6"/>
    <text x="98" y="119" fill="#cfd3d6" font-size="12">Workbench.tsx</text>
    <path d="M84 136 h6 v2 h8 v9 h-14 z" fill="none" stroke="#cfd3d6"/>
    <text x="98" y="141" fill="#cfd3d6" font-size="12">styles.ts</text>
    <path d="M84 158 h6 v2 h8 v9 h-14 z" fill="none" stroke="#cfd3d6"/>
    <text x="98" y="163" fill="#cfd3d6" font-size="12">MonacoEditor.tsx</text>
    <path d="M60 180 l4 4 l-4 4 z" fill="#adb2b8"/>
    <path d="M72 178 h8 v2 h6 l2 2 v8 h-16 z" fill="#679efe"/>
    <text x="94" y="185" fill="#cfd3d6" font-size="12">tests</text>
    <path d="M84 202 h6 v2 h8 v9 h-14 z" fill="none" stroke="#cfd3d6"/>
    <text x="98" y="207" fill="#cfd3d6" font-size="12">host.spec.ts</text>
    <rect width="210" height="22" x="48" y="214" fill="#ffffff24"/>
    <path d="M84 224 h6 v2 h8 v9 h-14 z" fill="none" stroke="#f9fafb"/>
    <text x="98" y="229" fill="#f9fafb" font-size="12">README.md</text>
    <path d="M84 246 h6 v2 h8 v9 h-14 z" fill="none" stroke="#cfd3d6"/>
    <text x="98" y="251" fill="#cfd3d6" font-size="12">README.en.md</text>
    <path d="M84 268 h6 v2 h8 v9 h-14 z" fill="none" stroke="#cfd3d6"/>
    <text x="98" y="273" fill="#cfd3d6" font-size="12">package.json</text>
  </g>

  <!-- Search -->
  <g>
    <animate attributeName="opacity" dur="9s" keyTimes="0;0.33;0.36;0.61;0.66;1" repeatCount="indefinite" values="0;0;1;1;0;0"/>
    <text x="60" y="70" fill="#adb2b8" font-size="11" letter-spacing=".6">SEARCH</text>
    <rect width="194" height="26" x="56" y="82" rx="4" fill="#2c2c2e" stroke="#ffffff1f"/>
    <circle cx="70" cy="95" r="5" fill="none" stroke="#adb2b8" stroke-width="1.5"/>
    <line x1="74" y1="99" x2="78" y2="103" stroke="#adb2b8" stroke-width="1.5"/>
    <text x="84" y="99" fill="#cfd3d6" font-size="12">saveDocument</text>
    <g font-size="10" fill="#adb2b8" text-anchor="middle">
      <rect width="24" height="16" x="56" y="116" rx="3" fill="#2c2c2e" stroke="#ffffff1f"/><text x="68" y="128">Aa</text>
      <rect width="24" height="16" x="86" y="116" rx="3" fill="#2c2c2e" stroke="#ffffff1f"/><text x="98" y="128">ab</text>
      <rect width="24" height="16" x="116" y="116" rx="3" fill="#2c2c2e" stroke="#ffffff1f"/><text x="128" y="128">.*</text>
    </g>
    <text x="56" y="156" fill="#e2e8f0" font-size="12" font-weight="600">src/host.ts</text>
    <text x="56" y="174" fill="#adb2b8" font-size="11">9</text><text x="70" y="174" fill="#cfd3d6" font-size="11">export function saveDocument</text>
    <text x="56" y="192" fill="#adb2b8" font-size="11">21</text><text x="70" y="192" fill="#cfd3d6" font-size="11">export function listFiles</text>
    <text x="56" y="210" fill="#adb2b8" font-size="11">33</text><text x="70" y="210" fill="#cfd3d6" font-size="11">export function workspacePath</text>
    <text x="56" y="236" fill="#e2e8f0" font-size="12" font-weight="600">src/wire.ts</text>
    <text x="56" y="254" fill="#adb2b8" font-size="11">4</text><text x="70" y="254" fill="#cfd3d6" font-size="11">export function encode</text>
  </g>

  <!-- Source Control -->
  <g>
    <animate attributeName="opacity" dur="9s" keyTimes="0;0.66;0.69;0.94;1" repeatCount="indefinite" values="0;0;1;1;0"/>
    <text x="60" y="70" fill="#adb2b8" font-size="11" letter-spacing=".6">SOURCE CONTROL</text>
    <g fill="none" stroke="#cfd3d6" stroke-width="1.5">
      <circle cx="63" cy="93" r="3"/><circle cx="70" cy="99" r="3"/>
      <path d="M63 93 q1 1 2 2 M70 99 q0 -1 -1 -2"/>
    </g>
    <text x="78" y="98" fill="#f9fafb" font-size="12">main</text>
    <text x="112" y="98" fill="#adb2b8" font-size="11">↑0 ↓0</text>
    <rect width="194" height="26" x="56" y="108" rx="4" fill="#2c2c2e" stroke="#ffffff1f"/>
    <text x="66" y="126" fill="#adb2b8" font-size="12">Message (Ctrl+Enter)</text>
    <text x="56" y="152" fill="#e2e8f0" font-size="12" font-weight="600">Changes</text>
    <rect width="20" height="16" x="112" y="140" rx="8" fill="#353638"/>
    <text x="122" y="152" fill="#cfd3d6" font-size="10" text-anchor="middle">2</text>
    <text x="68" y="172" fill="#f59e0b" font-size="11" font-family="ui-monospace, monospace">M</text>
    <text x="80" y="172" fill="#cfd3d6" font-size="12">README.md</text>
    <text x="68" y="192" fill="#f59e0b" font-size="11" font-family="ui-monospace, monospace">U</text>
    <text x="80" y="192" fill="#cfd3d6" font-size="12">untracked.txt</text>
    <text x="56" y="224" fill="#e2e8f0" font-size="12" font-weight="600">Graph</text>
    <rect width="20" height="16" x="98" y="212" rx="8" fill="#353638"/>
    <text x="108" y="224" fill="#cfd3d6" font-size="10" text-anchor="middle">3</text>
    <g fill="none" stroke="#adb2b8" stroke-width="1.4">
      <path d="M64 250 v14 M64 270 v14 M64 290 v0"/>
      <path d="M64 270 h10 q6 0 6 6 v4"/>
    </g>
    <circle cx="64" cy="250" r="3.5" fill="#679efe"/>
    <circle cx="64" cy="270" r="3.5" fill="#679efe"/>
    <circle cx="80" cy="280" r="3.5" fill="#679efe"/>
    <text x="90" y="254" fill="#cfd3d6" font-size="12">fix: disable core.autocrlf</text>
    <text x="90" y="274" fill="#cfd3d6" font-size="12">docs: trim README</text>
    <text x="90" y="284" fill="#cfd3d6" font-size="12">feat: assemble workbench</text>
  </g>

  <!-- ======================= editor ======================= -->
  <rect width="262" height="332" x="258" y="48" fill="#232324"/>

  <!-- tab bar -->
  <rect width="262" height="36" x="258" y="48" fill="#151517"/>
  <rect width="120" height="36" x="258" y="48" fill="#232324"/>
  <line x1="258" y1="82" x2="378" y2="82" stroke="#679efe" stroke-width="1.5"/>
  <line x1="378" y1="48" x2="378" y2="84" stroke="#ffffff14"/>
  <circle cx="268" cy="66" r="3" fill="#679efe">
    <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="0.25;1;0.25"/>
  </circle>
  <text x="276" y="70" fill="#f9fafb" font-size="12">README.md</text>
  <text x="368" y="70" fill="#adb2b8" font-size="12">✕</text>
  <text x="390" y="70" fill="#adb2b8" font-size="12">src/Workbench.tsx</text>

  <!-- editor body -->
  <line x1="304" y1="84" x2="304" y2="380" stroke="#ffffff0f"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="296" y="100" fill="#6e7681" text-anchor="end">1</text>
    <text x="312" y="100" fill="#d4d4d4"><tspan fill="#569cd6">export</tspan><tspan> </tspan><tspan fill="#569cd6">function</tspan><tspan> </tspan><tspan fill="#dcdcaa">Workbench</tspan><tspan>() {</tspan></text>

    <text x="296" y="120" fill="#6e7681" text-anchor="end">2</text>
    <text x="312" y="120" fill="#d4d4d4"><tspan fill="#569cd6">const</tspan><tspan> [tabs, setTabs] = </tspan><tspan fill="#dcdcaa">useState</tspan><tspan>&lt;</tspan><tspan fill="#4ec9b0">Tab</tspan><tspan>[]&gt;([])</tspan></text>

    <text x="296" y="140" fill="#6e7681" text-anchor="end">3</text>
    <text x="312" y="140" fill="#d4d4d4"><tspan fill="#569cd6">const</tspan><tspan> [active, setActive] = </tspan><tspan fill="#dcdcaa">useState</tspan><tspan>&lt;</tspan><tspan fill="#4ec9b0">string</tspan><tspan>&gt;()</tspan></text>

    <text x="296" y="180" fill="#6a9955">5</text>
    <text x="312" y="180" fill="#6a9955">// open a file from the Explorer</text>

    <text x="296" y="200" fill="#6e7681" text-anchor="end">6</text>
    <text x="312" y="200" fill="#d4d4d4"><tspan fill="#569cd6">const</tspan><tspan> open = </tspan><tspan fill="#569cd6">async</tspan><tspan> (path: </tspan><tspan fill="#4ec9b0">string</tspan><tspan>) =&gt; {</tspan></text>

    <text x="296" y="220" fill="#6e7681" text-anchor="end">7</text>
    <text x="312" y="220" fill="#d4d4d4"><tspan fill="#569cd6">const</tspan><tspan> doc = </tspan><tspan fill="#569cd6">await</tspan><tspan> </tspan><tspan fill="#dcdcaa">api</tspan><tspan>(</tspan><tspan fill="#ce9178">'read'</tspan><tspan>, { path })</tspan></text>

    <text x="296" y="240" fill="#6e7681" text-anchor="end">8</text>
    <text x="312" y="240" fill="#d4d4d4"><tspan fill="#dcdcaa">setTabs</tspan><tspan>(t =&gt; [...t, doc])</tspan></text>

    <text x="296" y="260" fill="#6e7681" text-anchor="end">9</text>
    <text x="312" y="260" fill="#d4d4d4">}</text>

    <text x="296" y="280" fill="#6e7681" text-anchor="end">10</text>
    <text x="312" y="280" fill="#d4d4d4"><tspan fill="#569cd6">return</tspan><tspan> &lt;</tspan><tspan fill="#4ec9b0">Editor</tspan><tspan> value={draft} /&gt;</tspan></text>
  </g>

  <!-- blinking caret -->
  <rect width="1.6" height="15" x="334" y="284" fill="#cfd3d6">
    <animate attributeName="opacity" dur="1s" keyTimes="0;0.5;1" repeatCount="indefinite" values="1;0;1"/>
  </rect>

  <!-- ======================= dsh conversation ======================= -->
  <rect width="202" height="332" x="518" y="48" fill="#151517"/>
  <line x1="518" y1="48" x2="518" y2="380" stroke="#ffffff14"/>

  <rect width="202" height="36" x="518" y="48" fill="#151517"/>
  <line x1="518" y1="84" x2="720" y2="84" stroke="#ffffff14"/>
  <circle cx="532" cy="66" r="6" fill="#679efe"/>
  <text x="544" y="70" fill="#f9fafb" font-size="12" font-weight="600">DSH</text>
  <text x="710" y="70" fill="#adb2b8" font-size="13" text-anchor="end">✕</text>

  <rect width="150" height="30" x="560" y="96" rx="12" fill="#263148"/>
  <text x="570" y="115" fill="#e2e8f0" font-size="12">open README.md</text>

  <rect width="170" height="44" x="528" y="134" rx="10" fill="#232324" stroke="#ffffff1f"/>
  <text x="538" y="154" fill="#e2e8f0" font-size="12">Opened. Search, Git, and</text>
  <text x="538" y="170" fill="#e2e8f0" font-size="12">preview are ready.</text>

  <rect width="186" height="30" x="526" y="336" rx="15" fill="#232324" stroke="#ffffff1f"/>
  <text x="536" y="355" fill="#adb2b8" font-size="12">Ask DeepSeek…</text>

  <!-- ======================= status bar ======================= -->
  <rect width="720" height="24" x="0" y="378" fill="#679efe"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.5">
    <circle cx="16" cy="390" r="3"/><circle cx="23" cy="396" r="3"/>
    <path d="M16 390 q1 1 2 2 M23 396 q0 -1 -1 -2"/>
  </g>
  <text x="31" y="394" fill="#ffffff" font-size="12">main</text>
  <text x="70" y="394" fill="#ffffff" font-size="12" opacity=".85">/home/tingfeng/dsh-vscode-workbench</text>
  <text x="706" y="394" fill="#ffffff" font-size="12" text-anchor="end">返回 DSH</text>

  <!-- footer -->
  <rect width="720" height="18" x="0" y="402" fill="#0d0f13"/>
  <text x="360" y="414" fill="#5b616a" font-size="11" text-anchor="middle">Explorer · Monaco editor · Search · Git · DSH conversation — looped demo</text>
</svg>
